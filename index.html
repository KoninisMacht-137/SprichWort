<!DOCTYPE html>
<html lang="de">
<head> 
  <meta charset="UTF-8" />
  <title>Wort des Tages</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <script src="contents.js"></script>
  <script src="main.js"></script>
</head>
<body>
  <div class="page">
    <header>
      <h1><span>Wort des Tages</span></h1>
      <p>Ein täglicher Funken Inspiration</p>
    </header>

    <main class="content-wrapper">
      <!-- Hauptkarte -->
    <div class="center-wrapper">
      <section class="card" id="main-card">
        <div class="card-inner">
          <div class="card-header">
            <div class="card-header-left">
              <div class="icon-badge" id="content-icon">📜</div>
              <div>
                <div class="type-label" id="content-type">Sprichwort</div>
                <div class="date-label">
                  <span>Heute:</span>
                  <span class="date-pill" id="content-date"></span>
                </div>
              </div>
            </div>
            <div class="mood-tag" id="content-mood">
              <span>Stimmung:</span>
              <span id="content-mood-text">warm & nachdenklich</span>
            </div>
          </div>

          <div class="card-body">
            <div class="card-title" id="content-title">Wort des Tages</div>
            <p class="card-text" id="content-text">
              Lade den ersten Funken Inspiration …
            </p>
          </div>

          <div class="card-footer">
            <div class="mood-tag">
              <span>✨</span>
              <span>Ein kleiner Moment für dich.</span>
            </div>
            <div class="controls">
              <button class="btn-secondary" id="btn-today">
                <span class="icon">📅</span>
                <span>Heutigen Inhalt</span>
              </button>
              <button class="btn-primary" id="btn-random">
                <span class="icon">🎲</span>
                <span>Zufälligen Inhalt anzeigen</span>
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer>
      <p>
        <span>Kreativität ist ein leiser Besucher</span> – sie kommt oft genau dann, wenn du kurz innehältst.
      </p>
    </footer>
  </div>

  <script>
    function formatDate(date) {
      return date.toLocaleDateString("de-DE", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function getDayIndex(date) {
      const start = new Date(date.getFullYear(), 0, 1);
      const diff = date - start;
      const oneDay = 24 * 60 * 60 * 1000;
      return Math.floor(diff / oneDay);
    }

    function getTodayContent() {
      const today = new Date();
      const dayIndex = getDayIndex(today);
      const index = dayIndex % contents.length;
      return { content: contents[index], date: today, index };
    }

    function setCardContent(contentObj, date) {
      const { type, icon, title, text, mood } = contentObj;

      const iconEl = document.getElementById("content-icon");
      const typeEl = document.getElementById("content-type");
      const dateEl = document.getElementById("content-date");
      const titleEl = document.getElementById("content-title");
      const textEl = document.getElementById("content-text");
      const moodTextEl = document.getElementById("content-mood-text");
      const mainCard = document.getElementById("main-card");

      mainCard.classList.remove("fade-swap");
      void mainCard.offsetWidth; // reflow für Animation
      mainCard.classList.add("fade-swap");

      iconEl.textContent = icon;
      typeEl.textContent = type;
      dateEl.textContent = formatDate(date);
      titleEl.textContent = title;

      // Zeilenumbrüche im Gedicht respektieren
      textEl.innerHTML = text
        .split("\n")
        .map(line => line.trim())
        .filter(line => line.length > 0)
        .map(line => `<span>${line}</span>`)
        .join("<br>");

      moodTextEl.textContent = mood;
    }

    function buildArchive() {
      const listEl = document.getElementById("archive-items");
      listEl.innerHTML = "";

      const today = new Date();
      const yearStart = new Date(today.getFullYear(), 0, 1);
      const todayIndex = getDayIndex(today);

      // Wir erzeugen für jeden Tag bis heute einen Eintrag (Mapping über Modulo)
      for (let day = 0; day <= todayIndex; day++) {
        const date = new Date(yearStart.getTime() + day * 24 * 60 * 60 * 1000);
        const index = day % contents.length;
        const c = contents[index];

        const li = document.createElement("li");
        li.className = "archive-item";

        li.innerHTML = `
          <div class="archive-item-icon">${c.icon}</div>
          <div>
            <div class="archive-item-meta">
              <span class="archive-item-type">${c.type}</span>
              <span class="archive-item-date">${formatDate(date)}</span>
            </div>
            <div class="archive-item-text">${c.text.replace(/\n/g, "<br>")}</div>
          </div>
        `;

        listEl.appendChild(li);
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const { content, date } = getTodayContent();
      setCardContent(content, date);
      buildArchive();

      const btnToday = document.getElementById("btn-today");
      const btnRandom = document.getElementById("btn-random");
      const archiveToggle = document.getElementById("archive-toggle");
      const archiveList = document.getElementById("archive-list");

      btnToday.addEventListener("click", () => {
        const { content, date } = getTodayContent();
        setCardContent(content, date);
      });

      btnRandom.addEventListener("click", () => {
        const randomIndex = Math.floor(Math.random() * contents.length);
        const randomContent = contents[randomIndex];
        const randomDate = new Date(); // Datum bleibt heute, nur Inhalt wechselt
        setCardContent(randomContent, randomDate);
      });

      archiveToggle.addEventListener("click", () => {
        archiveList.classList.toggle("collapsed");
      });
    });
  </script>
</body>
</html>
